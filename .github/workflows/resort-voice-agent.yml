name: resort-voice-agent

on:
  push:
    paths: ["resort-voice-agent/**", ".github/workflows/resort-voice-agent.yml"]
  pull_request:
    paths: ["resort-voice-agent/**", ".github/workflows/resort-voice-agent.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resort-voice-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resort-voice-agent/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t resort-voice-agent:ci .
