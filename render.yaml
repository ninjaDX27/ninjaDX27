# Blueprint do Render: Dashboard > New > Blueprint > escolher este repositório.
# Cria o serviço web (Docker) e a base de dados Postgres na região de Frankfurt (UE).
services:
  - type: web
    name: atendia
    runtime: docker
    rootDir: resort-voice-agent
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: 0.5c-512mb       # antigo "Starter"
    numInstances: 1          # uma instância: o limite de chamadas simultâneas é contado em memória
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BRAND_NAME
        value: Atendia
      - key: DATABASE_URL
        fromDatabase:
          name: atendia-db
          property: connectionString
      - key: MASTER_ENCRYPTION_KEY      # NÃO alterar depois de haver dados: deixariam de poder ser lidos
        sync: false
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL            # ex.: https://atendia.onrender.com ou o seu domínio
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

databases:
  - name: atendia-db
    databaseName: atendia
    region: frankfurt
    plan: 0.1c-256mb       # antigo "Basic-256mb"
    ipAllowList: []          # sem acesso externo: só o serviço web, pela rede interna
