; Plano de marcação do Atendia.
; Variáveis de ambiente lidas aqui: ATENDIA_URL, ASTERISK_SECRET, AUDIOSOCKET_ADDR, DEFAULT_DID, DIAL_PREFIX.

[general]
static=yes
writeprotect=yes

[globals]

; Chamadas que chegam do operador SIP.
[from-trunk]
exten => _[+0-9].,1,Goto(atendia,${EXTEN},1)
; Alguns operadores não enviam o número marcado: usa-se DEFAULT_DID.
exten => _[a-zA-Z].,1,GotoIf($["${ENV(DEFAULT_DID)}" = ""]?nodid)
 same => n,Goto(atendia,${ENV(DEFAULT_DID)},1)
 same => n(nodid),Hangup(21)
exten => s,1,GotoIf($["${ENV(DEFAULT_DID)}" = ""]?nodid)
 same => n,Goto(atendia,${ENV(DEFAULT_DID)},1)
 same => n(nodid),Hangup(21)

[atendia]
exten => _[+0-9].,1,NoOp(Atendia: chamada para ${EXTEN})
 same => n,Set(UUID=${FILTER(0-9a-f\-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=8)
 same => n,Set(START=${CURL(${ENV(ATENDIA_URL)}/asterisk/start?key=${ENV(ASTERISK_SECRET)}&uuid=${UUID}&did=${URIENCODE(${EXTEN})}&from=${URIENCODE(${CALLERID(num)})})})
 same => n,Set(ACTION=${CUT(START,:,1)})
 same => n,GotoIf($["${ACTION}" = "ok"]?talk)
 same => n,GotoIf($["${ACTION}" = "transfer"]?now)
 ; Número sem cliente ativo, ou Atendia indisponível.
 same => n,Answer()
 same => n,Playback(ss-noservice)
 same => n,Hangup()
 ; Conversa com o assistente.
 same => n(talk),Answer()
 ; Liga ao Atendia como um canal: quando a conversa acaba, o plano continua (opção g).
 same => n,Dial(AudioSocket/${ENV(AUDIOSOCKET_ADDR)}/${UUID},,g)
 same => n,Set(RESULT=${CURL(${ENV(ATENDIA_URL)}/asterisk/handoff?key=${ENV(ASTERISK_SECRET)}&uuid=${UUID})})
 same => n,GotoIf($["${CUT(RESULT,:,1)}" != "transfer"]?done)
 same => n,Set(DEST=${FILTER(0123456789,${CUT(RESULT,:,2)})})
 same => n,Goto(dial)
 ; Limite do plano atingido: direto para a receção.
 same => n(now),Set(DEST=${FILTER(0123456789,${CUT(START,:,2)})})
 same => n(dial),GotoIf($["${DEST}" = ""]?done)
 same => n,Dial(PJSIP/${ENV(DIAL_PREFIX)}${DEST}@trunk,30)
 same => n(done),Hangup()
