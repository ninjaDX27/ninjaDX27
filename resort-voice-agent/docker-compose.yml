# Para um servidor próprio (VPS). Ponha um reverse proxy com HTTPS à frente (ex.: Caddy).
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://atendia:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/atendia
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atendia
      POSTGRES_USER: atendia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atendia -d atendia"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
