services:
  voice-agent:
    build: .
    image: resort-voice-agent:latest
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # exposto só localmente; usar um reverse proxy HTTPS à frente
    volumes:
      - ./config/resort.json:/app/config/resort.json:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
